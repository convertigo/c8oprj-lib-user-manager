    description: |
      '(string) – JSON used to specify special behavior of the ''merge'' Policy. Optional <br/>
       In this strict JSON string, you can:<br/><br/>• <b>delete</b>: delete the target key. <br/>• <b>override</b>: replace the value of the target key, don''t merge this. <br/>• <b>prepend</b>: prepend the value or the array in the existing array or value of the target key. <br/>• <b>append</b>: append the value or the array in the existing array or value of the target key. <br/><br/>A target key is the path of the object to reach, separated by the "_separator" (default is dot). The target key is the same for the 2 documents to merge. <br/>Samples: <br/>{"a.b.c": "override", "a.b.d": "delete"} <br/>{"_separator": "+", "a+b+c": "override"} <br/><br/>'
↓Design_document [couchdb.DesignDocument]: 
  comment: |
    Account documents are accepted with the reserved ACL c8o:admin only, the one written by the lib_UserManager sequences (PostDocument, PostMergeDocument); a document from a FullSync client carries its user as ~c8oAcl.
    Documents written by earlier versions keep their ACL until their next write through PostDocument or PostMergeDocument.
  docdata: 
    →: |
      '{
        "_id": "_design\/Design_document",
        "filters": {},
        "updates": {},
        "validate_doc_update": "function (newDoc, oldDoc, userCtx, secObj) {\r\n
          \/\/ Accounts are written by the lib_UserManager sequences only, with the reserved ACL.\r\n
          \/\/ A document pushed by a FullSync client carries its user as ~c8oAcl and is refused.\r\n
          if (newDoc._id.indexOf(\"_design\/\") !== 0 && newDoc._deleted !== true && newDoc[\"~c8oAcl\"] !== \"c8o:admin\") {\r\n
              throw({forbidden: \"Accounts are written by the lib_UserManager sequences only.\"});\r\n
          }\r\n
      }",
        "views": {
          "PasswordLostAccountsByPasswordResetKey": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc[\"~c8oAcl\"] == \"c8o:admin\" && doc.account && \/^[0-9a-f]{64}$\/.test(doc.account.passwordResetKey) && (doc.account.status == ''confirmed'' || doc.account.status == ''draft'' || doc.account.status == ''passwordlost'')) {\r\n
                  emit(doc.account.passwordResetKey, {\r\n
                      site: doc.account.site,\r\n
                      email: doc.account.email,\r\n
                      expiresAt: doc.account.passwordResetExpiresAt\r\n
                  });\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          },
          "Users": {
            "map": "function (doc) {\r\n
          try {\r\n
              if (doc.account)\r\n
                  emit(doc.account.email, {\r\n
                          email: doc.account.email,\r\n
                          status: doc.account.status\r\n
                      }\r\n
                  );\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }\r\n
      "
          },
          "ListUsersAttributes": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.account.attributes){\r\n
          Object.keys(doc.account.attributes).forEach(function(e){\r\n
            emit([e,doc.account.attributes[e]], 1);\r\n
          })\r\n
           \r\n
          \r\n
        }\r\n
        \r\n
      \r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }\r\n
        "
          },
          "getDraftedAccounts": {
            "map": "function (doc) {\r\n
          try {\r\n
              if(doc.account && (doc.account.status == \"draft\" || doc.account.status == \"passwordlost\") && doc.account.timeStamp != undefined){\r\n
                  emit(doc.account.timeStamp, doc._rev);\r\n
              }\r\n
          } catch (err) {\r\n
              log(err.message);\r\n
          }\r\n
      }"
          }
        }
      }'
