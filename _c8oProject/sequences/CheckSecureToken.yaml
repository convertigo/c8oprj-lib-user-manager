↓CheckSecureToken [steps.SimpleStep-1739182783417]: 
  expression: |
    'var Base64 = java.util.Base64;
    var Mac = javax.crypto.Mac;
    var SecretKeySpec = javax.crypto.spec.SecretKeySpec;
    
    var validateJwtToken = (token, secretKey) => {
        // 1. Séparer les trois parties du token
        var parts = token.split(".");
        if (parts.length !== 3) {
            throw new Error("Invalid token format");
        }
    
        // 2. Décoder le header et le payload
        var headerJson = new java.lang.String(Base64.getUrlDecoder().decode(parts[0]), "UTF-8");
        var payloadJson = new java.lang.String(Base64.getUrlDecoder().decode(parts[1]), "UTF-8");
    
        var header = JSON.parse(headerJson);
        var payload = JSON.parse(payloadJson);
    
        // 3. Vérifier l''expiration du token (optionnel mais recommandé)
        var currentTime = Math.floor(new Date().getTime() / 1000);
        if (payload.exp && currentTime > payload.exp) {
            throw new Error("Token has expired");
        }
    
        // 4. Recréer la signature à partir des deux premières parties
        var dataToSign = parts[0] + "." + parts[1];
    
        var mac = Mac.getInstance("HmacSHA256");
        var keySpec = new SecretKeySpec(new java.lang.String(secretKey).getBytes("UTF-8"), "HmacSHA256");
        mac.init(keySpec);
    
        var expectedSignature = Base64.getUrlEncoder().withoutPadding()
                                     .encodeToString(mac.doFinal(new java.lang.String(dataToSign).getBytes("UTF-8")));
    
        // 5. Comparer la signature attendue et la signature du token
        if (expectedSignature != parts[2]) {
            throw new Error("Invalid token signature");
        }
    
        // 6. Si tout est valide, retourner les données du payload
        return payload;
    }
    let validated = false;
    try {
    	var secretKey = com.twinsoft.convertigo.engine.EnginePropertiesManager.getProperty(com.twinsoft.convertigo.engine.EnginePropertiesManager.PropertyName.CRYPTO_PASSPHRASE);
        var payload = validateJwtToken(token, secretKey);
        validated = true;
    } catch (e) {
        var error = e.message;
    }
    '
