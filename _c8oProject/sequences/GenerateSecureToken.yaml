↓GenerateSecureToken [steps.SimpleStep-1739180528208]: 
  expression: |
    '// Importer les classes nécessaires
    var Base64 = java.util.Base64;
    var Mac = javax.crypto.Mac;
    var SecretKeySpec = javax.crypto.spec.SecretKeySpec;
    var Date = java.util.Date;
    
    // Fonction pour créer un JWT token
    function generateJwtToken(username, secretKey) {
        // Header du JWT
        var header = {
            alg: "HS256",
            typ: "JWT"
        };
    
        // Payload du JWT
        var payload = {
            user: username,
            iss: "c8oApp",
            exp: Math.floor((new Date().getTime() + (tokenExpiration * 24 * 60 * 60 * 1000)) / 1000),  // Expiration dans 30 jours (en secondes),
            //exp: Math.floor((new Date().getTime()) / 1000), 
            pwd_hash: passwordHash  // Ajouter le hash du mot de passe
        };
    
        // Convertir en JSON
        var headerJson = JSON.stringify(header);
        var payloadJson = JSON.stringify(payload);
    
        // Encoder en Base64 URL-safe
        var encoder = Base64.getUrlEncoder().withoutPadding();
        var headerBase64 = encoder.encodeToString(new java.lang.String(headerJson).getBytes("UTF-8"));
        var payloadBase64 = encoder.encodeToString(new java.lang.String(payloadJson).getBytes("UTF-8"));
    
        // Construire la chaîne à signer
        var dataToSign = headerBase64 + "." + payloadBase64;
    
        // Générer la signature HMAC SHA256
        var mac = Mac.getInstance("HmacSHA256");
        var keySpec = new SecretKeySpec(new java.lang.String(secretKey).getBytes("UTF-8"), "HmacSHA256");
        mac.init(keySpec);
        var signatureBytes = mac.doFinal(new java.lang.String(dataToSign).getBytes("UTF-8"));
    
    
        // Encoder la signature en Base64 URL-safe
        var signatureBase64 = encoder.encodeToString(signatureBytes);
    
        // Retourner le JWT complet
        return dataToSign + "." + signatureBase64;
    }
    var secretKey = com.twinsoft.convertigo.engine.EnginePropertiesManager.getProperty(com.twinsoft.convertigo.engine.EnginePropertiesManager.PropertyName.CRYPTO_PASSPHRASE);
    var JWToken = generateJwtToken(userName, secretKey);
    '
