  expression: |
    '// javaImporter javaXnaming ldap
    var LDAPConnection = com.unboundid.ldap.sdk.LDAPConnection;
    var SearchRequest = com.unboundid.ldap.sdk.SearchRequest;
    var SearchScope = com.unboundid.ldap.sdk.SearchScope;
    var ResultCode = com.unboundid.ldap.sdk.ResultCode;
    var LDAPConnectionOptions = com.unboundid.ldap.sdk.LDAPConnectionOptions;
    var SSLUtil = com.unboundid.util.ssl.SSLUtil;
    
    var uidUser = user;
    var userPassword = password;
    var verbose = false;
    var ldapAdminUser = adminUser;
    var ldapAdminPassword = adminPassword;
    var ldapUrl = ldapServer;
    var ldapAdminUserBasePath = ldapBasePath ? ldapBasePath : "";
    
    
    var useSSL = false;
    var ldapHost = "localhost";
    var ldapPort = 389;
    
    var error = false;
    var errorMessage = null;
    var errorDetails = null;
    var groups = [];
    var groupsToInsert = [];
    var loggedIn = false;
    var userEmail = null;
    var userCN = null;
    
    if (ldapUrl.startsWith("ldaps://")) {
        useSSL = true;
        ldapUrl = ldapUrl.substring(8);
    } else if (ldapUrl.startsWith("ldap://")) {
        ldapUrl = ldapUrl.substring(7);
    }
    
    var parts = ldapUrl.split(":");
    if (parts.length > 1) {
        ldapHost = parts[0];
        ldapPort = parseInt(parts[1], 10);
    } else {
        ldapHost = ldapUrl;
    }
    
    try {
        var connOptions = new LDAPConnectionOptions();
        if (useSSL) {
            connOptions.setUseSSL(true);
            // Configurer les options SSL si nécessaire
            var sslUtil = new SSLUtil();
            // Vous pouvez configurer des options SSL spécifiques ici si nécessaire
        }
    
        // Connexion initiale pour obtenir le DN de l''utilisateur
        var conn = new LDAPConnection(connOptions, ldapHost, ldapPort);
    	var bindResult;
    	try {
        	bindResult = conn.bind(ldapAdminUser, ldapAdminPassword);
    	}
    	catch(e){
    		error = true;
    		errorMessage = "LDAP ADMIN Connexion error";
    		errorDetails = e;
    		log.error("[signInLDAPBulk] "+ errorMessage + ": " + errorDetails);
    		throw new Error("errorMessage");
    	}
        if (bindResult.getResultCode() != ResultCode.SUCCESS) {
    		error = true;
    		errorMessage = "LDAP ADMIN Connexion error";
    		errorDetails = bindResult.getDiagnosticMessage();
    		log.error("[signInLDAPBulk] "+ errorMessage + ": " + errorDetails);
    		throw new Error("errorMessage");
        }
        // Requête op_1 # Recherche de l''utilisateur
        var searchRequest = new SearchRequest(ldapAdminUserBasePath, SearchScope.SUB, "("+userIdAttribute+"=" + uidUser + ")");
        var searchResult = conn.search(searchRequest);
        if (searchResult.getEntryCount() > 0) {
            var entry = searchResult.getSearchEntries().get(0);
            var dn = entry.getDN();
            if (verbose) log.warn("  Requête op_1 = DN: " + dn);
    		userEmail = entry.getAttributeValue("mail");
    		userCN = entry.getAttributeValue("cn");
    
            // Fermer la connexion initiale
            conn.close();
    
            // Nouvelle connexion avec l''UID et le mot de passe de l''utilisateur pour vérifier les informations d''identification
            var userConnOptions = new LDAPConnectionOptions();
            if (useSSL) {
                userConnOptions.setUseSSL(true);
            }
            var userConn = new LDAPConnection(userConnOptions, ldapHost, ldapPort);
            var userBindResult;
    		try{
    			userBindResult = userConn.bind(dn, userPassword);
    		}
    		catch(e){
    			error = true;
    			errorMessage = "LDAP Connexion error with "+ dn ;
    			errorDetails = e;
    			log.error("[signInLDAPBulk] "+ errorMessage + ": " + errorDetails);
    			throw new Error("errorMessage");
    		} 
            if (userBindResult.getResultCode() != ResultCode.SUCCESS) {
    			error = true;
    			errorMessage = "LDAP Connexion error with "+ dn ;
    			errorDetails = userBindResult.getDiagnosticMessage()
    			log.error("[signInLDAPBulk] "+ errorMessage + ": " + errorDetails);
    			throw new Error("errorMessage");
            }
    		else{
    			loggedIn = true;
    		}
            userConn.close();
    
            // Re-connexion avec le gestionnaire pour effectuer la recherche des DroitPérimètre
            var managerConnOptions = new LDAPConnectionOptions();
            if (useSSL) {
                managerConnOptions.setUseSSL(true);
            }
            var managerConn = new LDAPConnection(managerConnOptions, ldapHost, ldapPort);
            managerConn.bind(ldapAdminUser, ldapAdminPassword);
    
            // Requête op_2 # Récupère les groupes de l''utilisateur
            var op2Request = new SearchRequest(ldapBasePathGroup, SearchScope.SUB, "(&(objectClass="+groupAttribute+")(uniqueMember=" + dn + "))");
            var op2Result = managerConn.search(op2Request);
            if (op2Result.getEntryCount() > 0) {
                var entries = op2Result.getSearchEntries();
                if (verbose) log.warn("  Requête op_2 = " + entries.size() + " DroitPérimètre :");
                var it = entries.iterator();
                while (it.hasNext()) {
                    var e = it.next();
                    log.warn(" = " + e.getAttributeValue(groupDisplayAttribute));
    				groups.push(e.getAttributeValue(groupDisplayAttribute));
    				groupsToInsert.push({user: uidUser, group: "ad:"+e.getAttributeValue(groupDisplayAttribute)});
                }
            } else {
                log.warn("  Requête op_2 = 0 DroitPérimètre");
            }
    
            // Fermer la connexion
            managerConn.close();
        } else {
            log.warn("  Requête op_1 = Le compte " + uidUser + " n''existe pas !");
        }
    
    } catch (e) {
    	loggedIn = false;
    	if(error == false){
    		error = true;
    		errorMessage = "LDAP error";
    		errorDetails = e;
    	}
        log.warn("Erreur LDAP: " + e.message);
    }
