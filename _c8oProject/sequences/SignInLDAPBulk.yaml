        var errorMessage = null;
        var errorDetails = null;
        var groups = [];
        var groupsToInsert = [];
        var loggedIn = false;
        var userEmail = null;
        var userCN = null;
    
        mark("Début script signInLDAPBulk pour user=" + uidUser);
    
        if (ldapUrl.startsWith("ldaps://")) {
            useSSL = true;
            ldapUrl = ldapUrl.substring(8);
        } else if (ldapUrl.startsWith("ldap://")) {
            ldapUrl = ldapUrl.substring(7);
        }
    
        var parts = ldapUrl.split(":");
        if (parts.length > 1) {
            ldapHost = parts[0];
            ldapPort = parseInt(parts[1], 10);
        } else {
            ldapHost = ldapUrl;
        }
        log.debug("[LDAP] Target host=" + ldapHost + " port=" + ldapPort + " useSSL=" + useSSL);
        lap("Parsing URL LDAP et préparation paramètres");
    
        var conn = null;
        var managerConn = null;
    
        try {
            // Configuration de l''environnement pour la connexion LDAP (admin)
            var env = new java.util.Hashtable();
            env.put(Context.INITIAL_CONTEXT_FACTORY, "com.sun.jndi.ldap.LdapCtxFactory");
            env.put(Context.PROVIDER_URL, "ldap://" + ldapHost + ":" + ldapPort);
            env.put(Context.SECURITY_AUTHENTICATION, "simple");
            env.put(Context.SECURITY_PRINCIPAL, ldapAdminUser);
            env.put(Context.SECURITY_CREDENTIALS, ldapAdminPassword);
            if (useSSL) env.put(Context.SECURITY_PROTOCOL, "ssl");
    
            mark("Bind ADMIN: début InitialLdapContext");
            conn = new InitialLdapContext(env, null);
            lap("Bind ADMIN: InitialLdapContext OK");
    
            // Recherche de l''utilisateur
            var searchControls = new SearchControls();
            searchControls.setSearchScope(SearchControls.SUBTREE_SCOPE);
    
            var userFilter = "(" + String(userIdAttribute) + "=" + uidUser + ")";
            mark("Search USER: base=''" + ldapAdminUserBasePath + "'' filter=''" + userFilter + "''");
            var searchResult = conn.search(ldapAdminUserBasePath, userFilter, searchControls);
            lap("Search USER: exécution recherche (conn.search) OK");
    
            if (searchResult.hasMore()) {
                var entryFetchStart = System.nanoTime();
                var entry = searchResult.next();
                var entryFetchMs = (System.nanoTime() - entryFetchStart) / 1e6;
                log.debug("[TIMER] Fetch premier SearchResult.next() = " + entryFetchMs.toFixed(3) + " ms");
    
                var dn = entry.getNameInNamespace();
                if (verbose) log.debug("  Requête op_1 = DN: " + dn);
    
                var mailAttr = entry.getAttributes().get("mail");
                if (mailAttr != null) userEmail = mailAttr.get();
    
                var cnAttr = entry.getAttributes().get("cn");
                if (cnAttr != null) userCN = cnAttr.get();
    
                lap("Traitement attributs utilisateur (mail, cn) OK");
    
                // Fermer la connexion initiale
                if (conn != null) {
                    conn.close();
                    lap("Fermeture connexion ADMIN (post op_1)");
                    conn = null;
                }
    
                // Vérification des identifiants de l''utilisateur (bind user)
                var userEnv = new java.util.Hashtable();
                userEnv.put(Context.INITIAL_CONTEXT_FACTORY, "com.sun.jndi.ldap.LdapCtxFactory");
                userEnv.put(Context.PROVIDER_URL, "ldap://" + ldapHost + ":" + ldapPort);
                userEnv.put(Context.SECURITY_AUTHENTICATION, "simple");
                userEnv.put(Context.SECURITY_PRINCIPAL, dn);
                userEnv.put(Context.SECURITY_CREDENTIALS, userPassword);
    			if (useSSL) userEnv.put(Context.SECURITY_PROTOCOL, "ssl");
    
                mark("Bind USER: début InitialLdapContext pour DN=" + dn);
                try {
                    var userConn = new InitialLdapContext(userEnv, null);
                    lap("Bind USER: InitialLdapContext OK");
                    loggedIn = true;
    
                    userConn.close();
                    lap("Bind USER: fermeture connexion OK");
                } catch (e) {
                    error = true;
                    errorMessage = "LDAP Connexion error with " + dn;
                    errorDetails = e;
                    log.error("[signInLDAPBulk] " + errorMessage + ": " + errorDetails);
                    throw new Error(errorMessage);
                }
    
                // Re-connexion admin/manager
                var managerEnv = new java.util.Hashtable();
                managerEnv.put(Context.INITIAL_CONTEXT_FACTORY, "com.sun.jndi.ldap.LdapCtxFactory");
                managerEnv.put(Context.PROVIDER_URL, "ldap://" + ldapHost + ":" + ldapPort);
                managerEnv.put(Context.SECURITY_AUTHENTICATION, "simple");
                managerEnv.put(Context.SECURITY_PRINCIPAL, ldapAdminUser);
                managerEnv.put(Context.SECURITY_CREDENTIALS, ldapAdminPassword);
    			if (useSSL) managerEnv.put(Context.SECURITY_PROTOCOL, "ssl");
    
                mark("Bind MANAGER: début InitialLdapContext");
                managerConn = new InitialLdapContext(managerEnv, null);
                lap("Bind MANAGER: InitialLdapContext OK");
    
                // Recherche des groupes
                var groupFilter = "(&(objectClass=" + String(groupAttribute) + ")(uniqueMember=" + dn + "))";
                mark("Search GROUPS: base=''" + String(ldapBasePathGroup) + "'' filter=''" + groupFilter + "''");
                var op2Result = managerConn.search(String(ldapBasePathGroup), groupFilter, searchControls);
                lap("Search GROUPS: exécution recherche (managerConn.search) OK");
    
                if (op2Result.hasMore()) {
                    var count = 0;
                    var iterateStart = System.nanoTime();
                    while (op2Result.hasMore()) {
                        var e = op2Result.next();
                        count++;
                        if (count === 1 || count % 10 === 0) {
                            // Log périodique pour voir si on « bloque » sur next()
                            var iterMs = (System.nanoTime() - iterateStart) / 1e6;
                            log.debug("[TIMER] itération groupes: " + count + " éléments lus en " + iterMs.toFixed(3) + " ms");
                        }
                        var groupAttr = e.getAttributes().get(String(groupDisplayAttribute));
                        if (groupAttr != null) {
                            var groupValue = groupAttr.get();
                            if (verbose) log.debug(" = " + groupValue);
                            groups.push(groupValue);
                            groupsToInsert.push({user: canonicalUser, group: "ad:" + groupValue});
                        }
                    }
                    var totalIterMs = (System.nanoTime() - iterateStart) / 1e6;
                    log.debug("[TIMER] itération groupes terminée: " + count + " éléments en " + totalIterMs.toFixed(3) + " ms");
                    lap("Search GROUPS: parcours des résultats terminé");
                } else {
                    log.debug("  Requête op_2 = 0 DroitPérimètre");
                    lap("Search GROUPS: aucun résultat");
                }
    
            } else {
                log.debug("  Requête op_1 = Le compte " + uidUser + " n''existe pas !");
                lap("Search USER: aucun résultat");
            }
        } catch (e) {
            loggedIn = false;
            if (error == false) {
                error = true;
                errorMessage = "LDAP error";
                errorDetails = e;
            }
            log.debug("Erreur LDAP: " + e.message);
        } finally {
            // Fermetures sûres + timings
            try {
                if (conn != null) {
                    conn.close();
                    lap("Fermeture connexion ADMIN (finally)");
                }
            } catch (closeErr1) {
                log.debug("Erreur fermeture connexion ADMIN: " + closeErr1);
            }
            try {
                if (managerConn != null) {
                    managerConn.close();
                    lap("Fermeture connexion MANAGER (finally)");
                }
            } catch (closeErr2) {
                log.debug("Erreur fermeture connexion MANAGER: " + closeErr2);
            }
            mark("Fin script signInLDAPBulk");
        }
    }
