↓GetPrimaryGroup [steps.SimpleStep-1755529419614]: 
  expression: |
    'with (JavaImporter(
    	javax.naming.Context,
    	javax.naming.directory.InitialDirContext,
    	javax.naming.directory.SearchControls,
    	java.util.Hashtable
    )) {
    	function sidToString(sid) {
    		function u8(i) { return sid[i] & 0xFF; }
    		if (!sid || sid.length < 8) throw "SID too short";
    		var rev = u8(0), cnt = u8(1);
    		if (sid.length !== 8 + 4 * cnt) throw "Bad length";
    		var auth = 0; for (var i = 2; i < 8; i++) auth = (auth << 8) | u8(i);
    		var parts = [], off = 8;
    		for (var j = 0; j < cnt; j++) {
    			var v = (u8(off)) | (u8(off + 1) << 8) | (u8(off + 2) << 16) | (u8(off + 3) << 24);
    			parts.push((v >>> 0)); off += 4;
    		}
    		return "S-" + rev + "-" + auth + "-" + parts.join("-");
    	}
    	
    	var env = new Hashtable();
    	env.put(Context.INITIAL_CONTEXT_FACTORY, "com.sun.jndi.ldap.LdapCtxFactory");
    	env.put(Context.PROVIDER_URL, "" + ldapServer);
    	env.put(Context.SECURITY_AUTHENTICATION, "simple");
    	env.put(Context.SECURITY_PRINCIPAL, "" + adminUser);
    	env.put(Context.SECURITY_CREDENTIALS, "" + adminPassword);
    
    	var ctx = new InitialDirContext(env);
    
    	var sc = new SearchControls();
    	sc.setSearchScope(SearchControls.SUBTREE_SCOPE);
    	sc.setReturningAttributes(["objectSid;binary", "primaryGroupID"]);
    
    	var baseDN = ldapBasePath;
    	var filter = "(sAMAccountName=" + sAMAccountName + ")";
    	var results = ctx.search(baseDN, filter, sc);
    
    	if (results.hasMore()) {
    		var sr = results.next();
    		var attrs = sr.getAttributes();
    		var attr = attrs.get("objectSid;binary");
    		var sidBytes = attr.get();
    
    		var osid = sidToString(sidBytes);
    		// log.debug("SID = " + osid); //S-1-5-21-2675315662-178584939-3677002858-1430
    		var grpId = attrs.get("primaryGroupID").get();
    		var grpSid = osid.replace(/-\d+$/, "-" + grpId);
    		
    		sc.setReturningAttributes(["cn"]);
    		filter = "(objectSid=" + grpSid + ")";
    		results = ctx.search(baseDN, filter, sc);
    		if (results.hasMore()) {
    			sr = results.next();
    			attrs = sr.getAttributes();
    			grpName = attrs.get("cn").get();
    		} else {
    			log.warn("No result for " + filter);
    		}
    	} else {
    		log.warn("No result for " + filter);
    	}
    }'
