    function toLdapHex(byteArray) {
        var hex = "";
        for (var i = 0; i < byteArray.length; i++) {
            var byte = byteArray[i] & 0xFF; // force unsigned
            var hexByte = byte.toString(16).toLowerCase();
            if (hexByte.length < 2) {
                hexByte = "0" + hexByte;
            }
            hex += "\\" + hexByte;
        }
        return hex;
    }
    
    function replaceSIDRID(sidString, newRID) {
        if (typeof sidString !== "string" || !sidString.startsWith("S-")) {
            throw new Error("Invalid SID format");
        }
    
        var parts = sidString.split("-");
        if (parts.length < 4) {
            throw new Error("SID must contain at least one subAuthority");
        }
    
        parts[parts.length - 1] = String(newRID);
        return parts.join("-");
    }
    
    function encodeSID(sidString) {
        if (!sidString.startsWith("S-")) {
            throw "Invalid SID format";
        }
    
        var parts = sidString.substring(2).split("-");
        var revision = parseInt(parts[0], 10);
        var identifierAuthority = parseInt(parts[1], 10);
        var subAuthorities = parts.slice(2).map(function (v) {
            return parseInt(v, 10);
        });
    
        if (subAuthorities.length > 255) {
            throw "Too many sub-authorities";
        }
    
        var byteLength = 8 + (subAuthorities.length * 4);
        var sidBytes = [];
    
        // 1 byte: revision
        sidBytes.push(revision & 0xFF);
    
        // 1 byte: subAuthority count
        sidBytes.push(subAuthorities.length & 0xFF);
    
        // 6 bytes: identifier authority (big-endian)
        for (var i = 5; i >= 0; i--) {
            sidBytes.push((identifierAuthority >> (8 * i)) & 0xFF);
        }
    
        // subAuthorities: 4 bytes each, little-endian
        for (var i = 0; i < subAuthorities.length; i++) {
            var rid = subAuthorities[i];
            sidBytes.push((rid) & 0xFF);
            sidBytes.push((rid >> 8) & 0xFF);
            sidBytes.push((rid >> 16) & 0xFF);
            sidBytes.push((rid >> 24) & 0xFF);
        }
    
        return sidBytes;
    }
    
    
    function decodeSID(sidBytes) {
        var revision = sidBytes[0];
        var subAuthorityCount = sidBytes[1];
    
        // Identifier Authority is 6 bytes (big-endian)
        var idAuthority = 0;
        for (var i = 2; i <= 7; i++) {
            idAuthority = (idAuthority << 8) | (sidBytes[i] & 0xFF);
        }
    
        var sid = "S-" + revision + "-" + idAuthority;
    
        // Each subAuthority is 4 bytes (little-endian)
        for (var i = 0; i < subAuthorityCount; i++) {
            var offset = 8 + (i * 4);
            var subAuth = (sidBytes[offset] & 0xFF) |
                          ((sidBytes[offset + 1] & 0xFF) << 8) |
                          ((sidBytes[offset + 2] & 0xFF) << 16) |
                          ((sidBytes[offset + 3] & 0xFF) << 24);
    
            // Ensure unsigned representation
            sid += "-" + (subAuth >>> 0);
        }
    
        return sid;
    }
    
    
    with (TWSLDAPAPI) {
    	// LDAP server setup
    	var ldapHost = ldapServer;
    	var bindDn = adminUser;
