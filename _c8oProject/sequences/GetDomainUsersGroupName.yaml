    	var baseDn = ldapBasePath;
    	var userLogin = user;
    
    	// 1. Create LDAP connection
    	var ldap = new TWSLDAP();
    
    	
    	// === 2. Search for user to get objectSID and primaryGroupID ===
    	var userFilter = "(objectClass=domain)";
    	var userAttributes = ["objectSid"];
    	ldap.search(
    		ldapHost,
    		bindDn,
    		bindPassword,
    		baseDn,
    		userFilter,
    		userAttributes,
    		60000, 10);
    
    	res = ldap.hasMoreResults()
    	if (!res) {
    	    throw "User not found";
    	}
    	
    	var userEntry = ldap.getNextResult();
    	var sidAttr = ldap.getResultEx("objectSID")[0];
    	
    	log.debug("User Entry: " + userEntry);
    	if (sidAttr == null) {
    	    throw "Missing objectSID or primaryGroupID";
    	}
    	
    	//var jsidBytes = sidAttr.getBytes("UTF-16"); // binary encoded as string
    	var sidBytes =[];
    	for(i=0; i< sidAttr.bytes.length(); i++) {
    		sidBytes.push(sidAttr.bytes[i])
    	}
    	
    	log.debug("sidBytes: " + sidBytes);
    	log.debug("HEX sidBytes: " + toLdapHex(sidBytes));
    	
    	var SID = decodeSID(sidBytes);
    	log.debug("SID : " + SID)
    
    	// replace last segment with primaryGroupID to get the PrimaryGroupSID
    	pgSID = SID + "-513"
    	log.debug("pgSID : " + pgSID)
    
    	// Reencode pgSID
    	bpgSID = encodeSID(pgSID)
    	
    	// Make it LDAP HEX
    	hexPgSID = toLdapHex(bpgSID);
    	log.debug("hexPgSID : " + hexPgSID)
    	
    	// Now Search in AD an object where SID is hexPgSid
    	groupFilter = "(objectSid=" + pgSID + ")";
    	groupAttributes = ["cn"];
    	ldap.search(
    		ldapHost,
    		bindDn,
    		bindPassword,
    		baseDn,
    		groupFilter,
    		groupAttributes,
    		60000, 10);	
    
    	res = ldap.hasMoreResults()
    	if (!res) {
    	    throw "Primary Group not found";
    	}
    			
    	PrimaryGroup =ldap.getNextResult();
    	log.debug("PrimaryGroup : " + PrimaryGroup)
    }
    
