↓NormalizeEmailLocale [steps.SimpleStep-1789133711374]: 
  comment: Normalizes the canonical mail locale, resolves the default localized subject and selects the locale-specific XSL.
  expression: |
    '// Canonical server-side locale and default subject selection for account confirmation emails.
    var normalizeEmailLocale = function(value){
    	var candidate = value == null ? "" : String(value).trim();
    	return ["en", "fr", "es", "it", "zh-CN"].indexOf(candidate) != -1 ? candidate : "en";
    };
    var normalizedEmailLocale = normalizeEmailLocale(lang);
    var accountConfirmationSubjects = {
    	"en": "Confirm your account",
    	"fr": "Confirmez votre compte",
    	"es": "Confirma tu cuenta",
    	"it": "Conferma il tuo account",
    	"zh-CN": "确认您的帐户"
    };
    var suppliedEmailSubject = emailSubject == null ? "" : String(emailSubject).trim();
    if(suppliedEmailSubject.length == 0){
    	var subjectApplicationName = targetApplicationName == null ? "" : String(targetApplicationName).trim();
    	var subjectSeparator = normalizedEmailLocale == "fr" ? " : " : (normalizedEmailLocale == "zh-CN" ? "：" : ": ");
    	emailSubject = subjectApplicationName.length == 0
    		? accountConfirmationSubjects[normalizedEmailLocale]
    		: subjectApplicationName + subjectSeparator + accountConfirmationSubjects[normalizedEmailLocale];
    }
    var accountConfirmationXsl = ".//emails/accountConfirmation_" + normalizedEmailLocale + ".xsl";
    context.addTextNodeUnderRoot("emailLocale", normalizedEmailLocale);
    context.addTextNodeUnderRoot("resolvedEmailSubject", String(emailSubject));'
