↓ResolveEmailLocalization [steps.SimpleStep-1790156854739]: 
  comment: Normalizes lang and resolves caller overrides, locale symbols, then generic symbols.
  expression: |
    '// Shared email locale normalization and explicit symbol fallback policy.
    var normalizeEmailLocale = function(value) {
    	var candidate = value == null ? "" : String(value).trim().replace(/_/g, "-").toLowerCase();
    	if (candidate == "en" || candidate.indexOf("en-") == 0) return "en";
    	if (candidate == "fr" || candidate.indexOf("fr-") == 0) return "fr";
    	if (candidate == "es" || candidate.indexOf("es-") == 0) return "es";
    	if (candidate == "it" || candidate.indexOf("it-") == 0) return "it";
    	if (candidate == "zh" || candidate == "zh-cn" || candidate == "zh-hans" || candidate.indexOf("zh-hans-") == 0) return "zh-CN";
    	return "en";
    };
    var firstNonBlankEmailValue = function() {
    	for (var i = 0; i < arguments.length; i++) {
    		var value = arguments[i];
    		if (value != null && String(value).trim().length > 0) return String(value);
    	}
    	return "";
    };
    var normalizedEmailLocale = normalizeEmailLocale(lang);
    var localizedEmailBodies = {
    	"en": symbolEmailBodyEn,
    	"fr": symbolEmailBodyFr,
    	"es": symbolEmailBodyEs,
    	"it": symbolEmailBodyIt,
    	"zh-CN": symbolEmailBodyZhCN
    };
    var localizedEmailSubjects = {
    	"en": symbolEmailSubjectEn,
    	"fr": symbolEmailSubjectFr,
    	"es": symbolEmailSubjectEs,
    	"it": symbolEmailSubjectIt,
    	"zh-CN": symbolEmailSubjectZhCN
    };
    var resolvedEmailBody = firstNonBlankEmailValue(emailBody, localizedEmailBodies[normalizedEmailLocale], symbolEmailBody, "Hello, an account has just been created for you. Please click on the following reset password Button to change your password and confirm your account.");
    var resolvedEmailSubject = firstNonBlankEmailValue(emailSubject, localizedEmailSubjects[normalizedEmailLocale], symbolEmailSubject, "Please confirm your account by creating a new password and clicking on the reset password button");
    lang = normalizedEmailLocale;
    emailBody = resolvedEmailBody;
    emailSubject = resolvedEmailSubject;
    '
